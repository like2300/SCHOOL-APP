name: CAMU - Build APK Debug

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Check Android configuration
        run: |
          ls -la android
          cat android/settings.gradle || true
          cat android/settings.gradle.kts || true
          cat android/build.gradle || true
          cat android/build.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camu-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

