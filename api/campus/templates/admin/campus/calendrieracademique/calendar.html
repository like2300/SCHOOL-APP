{% extends "admin/base_site.html" %}

{% block extrahead %}
{{ block.super }}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
{% endblock %}

{% block content %}
<div class="bg-white border border-base-200 rounded-default shadow-xs p-6 w-full dark:bg-base-900 dark:border-base-800">
    <div class="flex flex-row flex-wrap items-center gap-3 mb-4">
        <h2 class="font-semibold text-font-important-light text-lg dark:text-font-important-dark">
            Calendrier académique
        </h2>
        <span class="text-xs text-font-subtle-light dark:text-font-subtle-dark">
            Glisse les étiquettes pour déplacer un événement • Clique sur un jour pour en créer un
        </span>
        <span class="ml-auto flex flex-row items-center gap-3 text-xs">
            <span class="inline-flex items-center gap-1">
                <span class="inline-block w-3 h-3 rounded-sm" style="background:#1a6b3c"></span> Normal
            </span>
            <span class="inline-flex items-center gap-1">
                <span class="inline-block w-3 h-3 rounded-sm" style="background:#c62828"></span> Important
            </span>
        </span>
    </div>
    <div id="calendar"></div>
    {% csrf_token %}
</div>

<div id="event-modal" class="hidden fixed inset-0 z-[1000] items-center justify-center p-4" style="background:rgba(0,0,0,.4)">
    <div class="bg-white border border-base-200 rounded-default shadow-lg p-6 w-full max-w-lg dark:bg-base-900 dark:border-base-800">
        <h3 id="modal-title" class="font-semibold text-font-important-light text-base mb-4 dark:text-font-important-dark">
            Nouvel événement
        </h3>
        <input type="hidden" id="ev-id">
        <div class="flex flex-col gap-4">
            <div>
                <label class="block font-semibold mb-2 text-font-important-light text-sm dark:text-font-important-dark">Titre *</label>
                <input type="text" id="ev-title" required class="border border-base-200 bg-white font-medium rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark px-3 py-2 w-full">
            </div>
            <div class="flex flex-row gap-4">
                <div class="grow">
                    <label class="block font-semibold mb-2 text-font-important-light text-sm dark:text-font-important-dark">Début *</label>
                    <input type="date" id="ev-start" required class="border border-base-200 bg-white font-medium rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark dark:scheme-dark px-3 py-2 w-full">
                </div>
                <div class="grow">
                    <label class="block font-semibold mb-2 text-font-important-light text-sm dark:text-font-important-dark">Fin</label>
                    <input type="date" id="ev-end" class="border border-base-200 bg-white font-medium rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark dark:scheme-dark px-3 py-2 w-full">
                </div>
            </div>
            <div>
                <label class="block font-semibold mb-2 text-font-important-light text-sm dark:text-font-important-dark">Description</label>
                <textarea id="ev-desc" rows="3" class="border border-base-200 bg-white font-medium rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark px-3 py-2 w-full"></textarea>
            </div>
            <label class="inline-flex items-center gap-2 text-sm font-medium cursor-pointer">
                <input type="checkbox" id="ev-important" class="h-4 w-4">
                Événement important
            </label>
        </div>
        <div class="flex flex-row gap-2 mt-5">
            <button id="ev-save" class="border cursor-pointer font-medium px-3 py-2 rounded-default text-center whitespace-nowrap bg-primary-600 border-transparent text-white hover:bg-primary-600/80 inline-flex items-center gap-1">
                <span class="material-symbols-outlined -ml-0.5">save</span>
                Enregistrer
            </button>
            <button id="ev-delete" class="hidden border cursor-pointer font-medium px-3 py-2 rounded-default text-center whitespace-nowrap border-red-600 bg-red-600 text-white hover:bg-red-600/80 inline-flex items-center gap-1">
                <span class="material-symbols-outlined -ml-0.5">delete</span>
                Supprimer
            </button>
            <button id="ev-cancel" class="border border-base-200 bg-white shadow-xs text-important dark:border-base-700 dark:bg-transparent hover:bg-base-100/80 dark:hover:bg-base-800/80 font-medium px-3 py-2 rounded-default text-center whitespace-nowrap">
                Annuler
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    var API = '/api/calendrier/';
    function csrf() {
        var m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? m[1] : '';
    }
    function headers() {
        return {'Content-Type': 'application/json', 'X-CSRFToken': csrf()};
    }
    function exclEnd(dateFin) {
        if (!dateFin) return null;
        var d = new Date(dateFin + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        return d.toISOString().slice(0, 10);
    }
    function inclEnd(excl) {
        if (!excl) return '';
        var d = new Date(excl.slice(0, 10) + 'T00:00:00');
        d.setDate(d.getDate() - 1);
        return d.toISOString().slice(0, 10);
    }
    function color(important) { return important ? '#c62828' : '#1a6b3c'; }

    var modal = document.getElementById('event-modal');
    var fId = document.getElementById('ev-id');
    var fTitle = document.getElementById('ev-title');
    var fStart = document.getElementById('ev-start');
    var fEnd = document.getElementById('ev-end');
    var fDesc = document.getElementById('ev-desc');
    var fImp = document.getElementById('ev-important');
    var btnDel = document.getElementById('ev-delete');

    function openModal(data) {
        document.getElementById('modal-title').textContent = data.id ? "Modifier l'événement" : 'Nouvel événement';
        fId.value = data.id || '';
        fTitle.value = data.title || '';
        fStart.value = data.start || '';
        fEnd.value = data.end || '';
        fDesc.value = data.description || '';
        fImp.checked = !!data.important;
        btnDel.classList.toggle('hidden', !data.id);
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }
    function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    document.getElementById('ev-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'fr',
        firstDay: 1,
        height: 'auto',
        headerToolbar: {left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay'},
        buttonText: {today: "Aujourd'hui", month: 'Mois', week: 'Semaine', day: 'Jour'},
        editable: true,
        selectable: true,
        events: function (info, success, failure) {
            fetch(API).then(function (r) { return r.json(); }).then(function (data) {
                var list = Array.isArray(data) ? data : (data.results || []);
                success(list.map(function (e) {
                    return {
                        id: e.id,
                        title: e.title,
                        start: e.date_debut,
                        end: exclEnd(e.date_fin),
                        allDay: true,
                        backgroundColor: color(e.is_important),
                        borderColor: color(e.is_important),
                        extendedProps: {description: e.description, is_important: e.is_important}
                    };
                }));
            }).catch(failure);
        },
        select: function (info) {
            openModal({start: info.startStr.slice(0, 10), end: inclEnd(info.endStr)});
            calendar.unselect();
        },
        eventClick: function (info) {
            var e = info.event;
            openModal({
                id: e.id,
                title: e.title,
                start: (e.startStr || '').slice(0, 10),
                end: inclEnd(e.endStr),
                description: e.extendedProps.description || '',
                important: e.extendedProps.is_important
            });
        },
        eventDrop: function (info) { moveResize(info, 'déplacé'); },
        eventResize: function (info) { moveResize(info, 'redimensionné'); }
    });
    calendar.render();

    function moveResize(info, what) {
        var e = info.event;
        var payload = {
            date_debut: (e.startStr || '').slice(0, 10),
            date_fin: e.endStr ? inclEnd(e.endStr) : (e.startStr || '').slice(0, 10)
        };
        fetch(API + e.id + '/', {method: 'PATCH', headers: headers(), body: JSON.stringify(payload)})
            .then(function (r) { if (!r.ok) throw 0; })
            .catch(function () { info.revert(); alert("Événement non " + what + " (erreur serveur)."); });
    }

    document.getElementById('ev-save').addEventListener('click', function () {
        if (!fTitle.value.trim() || !fStart.value) { alert('Titre et date de début requis.'); return; }
        var payload = {
            title: fTitle.value.trim(),
            date_debut: fStart.value,
            date_fin: fEnd.value || fStart.value,
            description: fDesc.value,
            is_important: fImp.checked
        };
        var url = fId.value ? API + fId.value + '/' : API;
        var method = fId.value ? 'PATCH' : 'POST';
        fetch(url, {method: method, headers: headers(), body: JSON.stringify(payload)})
            .then(function (r) { if (!r.ok) throw 0; closeModal(); calendar.refetchEvents(); })
            .catch(function () { alert("Enregistrement impossible (erreur serveur)."); });
    });

    btnDel.addEventListener('click', function () {
        if (!fId.value || !confirm('Supprimer cet événement ?')) return;
        fetch(API + fId.value + '/', {method: 'DELETE', headers: headers()})
            .then(function (r) { if (!r.ok) throw 0; closeModal(); calendar.refetchEvents(); })
            .catch(function () { alert('Suppression impossible (erreur serveur).'); });
    });
})();
</script>
{% endblock %}
